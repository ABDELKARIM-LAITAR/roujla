  .app-soft .app-ico { background: linear-gradient(135deg,#334155,#0f172a); }
  .app-map .app-ico { background: linear-gradient(135deg,#2dd4bf,#0f766e); box-shadow: 0 4px 10px -5px rgba(13,148,136,.9); }
  .app-tr .app-ico { background: linear-gradient(135deg,#a78bfa,#6d28d9); box-shadow: 0 4px 10px -5px rgba(124,58,237,.9); }
  .app-ico svg { width: 15px; height: 15px; }
  .app-txt { display: flex; flex-direction: column; line-height: 1.05; text-align: start; }

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);

  /* ---------- Search engines ---------- */
  const ENGINES = {
    google: { name: 'Google',     web: q => `https://www.google.com/search?q=${q}`, images: q => `https://www.google.com/search?q=${q}&tbm=isch`, videos: q => `https://www.google.com/search?q=${q}&tbm=vid`, news: q => `https://www.google.com/search?q=${q}&tbm=nws` },
    bing:   { name: 'Bing',       web: q => `https://www.bing.com/search?q=${q}`,   images: q => `https://www.bing.com/images/search?q=${q}`,  videos: q => `https://www.bing.com/videos/search?q=${q}`,  news: q => `https://www.bing.com/news/search?q=${q}` },
    ddg:    { name: 'DuckDuckGo', web: q => `https://duckduckgo.com/?q=${q}`,        images: q => `https://duckduckgo.com/?q=${q}&iax=images&ia=images`, videos: q => `https://duckduckgo.com/?q=${q}&iax=videos&ia=videos`, news: q => `https://duckduckgo.com/?q=${q}&iar=news&ia=news` },
    brave:  { name: 'Brave',      web: q => `https://search.brave.com/search?q=${q}`, images: q => `https://search.brave.com/images?q=${q}`, videos: q => `https://search.brave.com/videos?q=${q}`, news: q => `https://search.brave.com/news?q=${q}` },
    yandex: { name: 'Yandex',     web: q => `https://yandex.com/search/?text=${q}`,  images: q => `https://yandex.com/images/search?text=${q}`, videos: q => `https://yandex.com/video/search?text=${q}`, news: q => `https://yandex.com/search/?text=${q}` }
  };
  const TABS = ['web', 'images', 'videos', 'news'];
  const TAB_ICON = { web: 'fa-globe', images: 'fa-image', videos: 'fa-circle-play', news: 'fa-newspaper' };

  /* ---------- Texts (Arabic / English) ---------- */
  const T = {
    ar: {
      dir: 'rtl', other: 'EN', tagline: 'اكتب سؤالك واختر محرك البحث. المعلومة بنقرة واحدة.',
      placeholder: 'ابحث في الإنترنت...', go: 'بحث', web: 'الكل', images: 'صور', videos: 'فيديو', news: 'أخبار',
      wiki: 'ويكيبيديا', readMore: 'اقرأ المزيد', noAnswer: 'لا توجد إجابة سريعة لهذا البحث. اختر محرك بحث بالأعلى.',
      openOn: 'افتح النتائج في', clear: 'مسح', loading: 'جارٍ التحميل...',
      foot: 'roujla لا يخزن بحثك. النتائج تأتي من محركات البحث التي تختارها.', wikiLang: 'ar',
      aiSub: 'اسأل الذكاء', softSub: 'تحميل البرامج', aiAsk: 'اسأل عن هذا',
      mapSub: 'خريطة العالم', mapAsk: 'اعرض على الخريطة',
      trSub: 'ترجمة فورية', trAsk: 'ترجم هذا',
      aiTitle: 'ROUJLA AI - اسأل الذكاء الاصطناعي', softTitle: 'ROUJLA SOFT - تحميل البرامج',
      mapTitle: 'ROUJLA MAP - خريطة العالم', trTitle: 'ROUJLA TRANSLATE - ترجمة فورية'
    },
    en: {
      dir: 'ltr', other: 'AR', tagline: 'Type your question and pick a search engine. Answers in one click.',
      placeholder: 'Search the web...', go: 'Search', web: 'All', images: 'Images', videos: 'Videos', news: 'News',
      wiki: 'Wikipedia', readMore: 'Read more', noAnswer: 'No quick answer for this search. Pick a search engine above.',
      openOn: 'Open results on', clear: 'Clear', loading: 'Loading...',
      foot: 'roujla does not store your searches. Results come from the search engines you choose.', wikiLang: 'en',
      aiSub: 'Ask the AI', softSub: 'Download apps', aiAsk: 'Ask this',
      mapSub: 'World map', mapAsk: 'Show on map',
      trSub: 'Instant translation', trAsk: 'Translate this',
      aiTitle: 'ROUJLA AI - Ask the AI', softTitle: 'ROUJLA SOFT - Download apps',
      mapTitle: 'ROUJLA MAP - World map', trTitle: 'ROUJLA TRANSLATE - Instant translation'
    }
  };

  /* ---------- State (localStorage is optional) ---------- */
  const store = {
    get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let lang = store.get('rj_lang', (navigator.language || 'ar').startsWith('ar') ? 'ar' : 'en');
  let engine = store.get('rj_engine', 'google');
  let tab = 'web';
  let sugItems = [], sugIndex = -1, sugCtl = null, sugTimer = null;

  if (!ENGINES[engine]) engine = 'google';
  const t = () => T[lang];

  /* ---------- Theme ---------- */
  const root = document.documentElement;
  const applyTheme = d => { root.classList.toggle('dark', d); root.classList.toggle('light', !d); };
  applyTheme(store.get('rj_theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') === 'dark');
  $('themeBtn').onclick = () => { const d = !root.classList.contains('dark'); applyTheme(d); store.set('rj_theme', d ? 'dark' : 'light'); };

  /* ---------- Render UI ---------- */
  function renderTabs() {
    $('tabs').innerHTML = TABS.map(k =>
      `<button role="tab" class="tab px-1 py-2 text-sm font-semibold border-b-2 border-transparent text-slate-600 dark:text-slate-400" data-tab="${k}" aria-selected="${k === tab}">
         <i class="fa-solid ${TAB_ICON[k]} mx-1"></i>${t()[k]}</button>`).join('');
    $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.tab; renderTabs(); if ($('q').value.trim()) search(); });
  }
  function renderEngines() {
    $('engines').innerHTML = Object.entries(ENGINES).map(([k, e]) =>
      `<button type="button" class="pill px-4 h-9 rounded-full border border-black/10 dark:border-white/15 bg-white dark:bg-white/5 text-sm font-semibold hover:border-brand-600" data-e="${k}" aria-pressed="${k === engine}">${e.name}</button>`).join('');
    $('engines').querySelectorAll('.pill').forEach(b => b.onclick = () => {
      engine = b.dataset.e; store.set('rj_engine', engine); renderEngines();
      if ($('q').value.trim()) search(); else $('q').focus();
    });
  }
  function applyLang() {
    const x = t();
    root.lang = lang; root.dir = x.dir;
    $('tagline').textContent = x.tagline; $('q').placeholder = x.placeholder; $('goBtn').textContent = x.go;
    $('langBtn').textContent = x.other; $('foot').textContent = x.foot; $('clearBtn').setAttribute('aria-label', x.clear);
    $('aiSub').textContent = x.aiSub; $('softSub').textContent = x.softSub;
    if ($('mapSub')) $('mapSub').textContent = x.mapSub;
    if ($('trSub')) $('trSub').textContent = x.trSub;
    $('aiLink').title = x.aiTitle; $('aiLink').setAttribute('aria-label', x.aiTitle);
    $('softLink').title = x.softTitle; $('softLink').setAttribute('aria-label', x.softTitle);
    if ($('mapLink')) { $('mapLink').title = x.mapTitle; $('mapLink').setAttribute('aria-label', x.mapTitle); }
    if ($('trLink')) { $('trLink').title = x.trTitle; $('trLink').setAttribute('aria-label', x.trTitle); }
    renderTabs(); renderEngines(); syncAiLink();
  }
  $('langBtn').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; store.set('rj_lang', lang); applyLang(); const q = $('q').value.trim(); if (q) showAnswer(q); };

  /* ---------- ROUJLA site family (GitHub Pages now, custom domain later) ---------- */
  const SITES = {
    github: {
      ai: 'https://abdelkarim-laitar.github.io/roujla-ai/',
      soft: 'https://abdelkarim-laitar.github.io/roujlasoft/',
      map: 'https://abdelkarim-laitar.github.io/roujla-map/',
      translate: 'https://abdelkarim-laitar.github.io/roujla-translate/'
    },
    domain: {
      ai: 'https://ai.roujla.com/',
      soft: 'https://soft.roujla.com/',
      map: 'https://map.roujla.com/',
      translate: 'https://translate.roujla.com/'
    }
  };
  const SITE = /(^|\.)roujla\.com$/i.test(location.hostname) ? SITES.domain : SITES.github;
  $('softLink').href = SITE.soft;
  if ($('trLink')) $('trLink').href = SITE.translate;

  function syncAiLink() {
    const q = $('q').value.trim();
    $('aiLink').href = q ? SITE.ai + '?q=' + encodeURIComponent(q) : SITE.ai;
    if ($('mapLink')) $('mapLink').href = q ? SITE.map + '?q=' + encodeURIComponent(q) : SITE.map;
    if ($('trLink')) $('trLink').href = q ? SITE.translate + '?q=' + encodeURIComponent(q) : SITE.translate;
    const sub = $('aiSub');
    if (sub) sub.textContent = q ? t().aiAsk : t().aiSub;
    const msub = $('mapSub');
    if (msub) msub.textContent = q ? t().mapAsk : t().mapSub;
    const tsub = $('trSub');
    if (tsub) tsub.textContent = q ? t().trAsk : t().trSub;
  }

  /* ---------- Go to the chosen engine ---------- */
  function search() {
    const q = $('q').value.trim();
    if (!q) return;
    closeSug();
    const url = ENGINES[engine][tab](encodeURIComponent(q));
    location.href = url;
  }
  $('form').addEventListener('submit', e => {
    e.preventDefault();
    if (sugIndex >= 0 && sugItems[sugIndex]) $('q').value = sugItems[sugIndex];
    search();
  });

  /* ---------- Suggestions (Wikipedia titles, CORS-enabled) ---------- */
  function closeSug() { $('sug').classList.add('hidden'); $('sug').innerHTML = ''; sugItems = []; sugIndex = -1; }
  function renderSug() {
    if (!sugItems.length) return closeSug();
    $('sug').innerHTML = sugItems.map((s, i) =>
      `<li role="option" class="sug-item flex items-center gap-3 px-4 py-2.5 cursor-pointer" data-i="${i}" aria-selected="${i === sugIndex}">
         <i class="fa-solid fa-magnifying-glass text-slate-400 text-sm"></i><span class="truncate"></span></li>`).join('');
    $('sug').querySelectorAll('.sug-item').forEach((li, i) => {
      li.querySelector('span').textContent = sugItems[i];
      li.onmousedown = e => { e.preventDefault(); $('q').value = sugItems[i]; search(); };
    });
    $('sug').classList.remove('hidden');
  }
  function fetchSug(q) {
    if (sugCtl) sugCtl.abort();
    sugCtl = new AbortController();
    const api = `https://${t().wikiLang}.wikipedia.org/w/api.php?action=opensearch&limit=6&namespace=0&format=json&origin=*&search=${encodeURIComponent(q)}`;
    fetch(api, { signal: sugCtl.signal }).then(r => r.json()).then(d => {
      if ($('q').value.trim() !== q) return;
      sugItems = (d[1] || []).filter(s => s.toLowerCase() !== q.toLowerCase());
      sugIndex = -1; renderSug();
    }).catch(() => {});
  }

  /* ---------- Quick answer card (Wikipedia summary) ---------- */
  async function showAnswer(q) {
    const box = $('answer');
    if (!q) { box.classList.add('hidden'); box.innerHTML = ''; return; }
    box.classList.remove('hidden');
    box.innerHTML = `<p class="text-center text-sm text-slate-500">${t().loading}</p>`;
    try {
      const w = t().wikiLang;
      const s = await (await fetch(`https://${w}.wikipedia.org/w/api.php?action=opensearch&limit=1&format=json&origin=*&search=${encodeURIComponent(q)}`)).json();
      const title = (s[1] || [])[0];
      if (!title) throw new Error('none');
      const d = await (await fetch(`https://${w}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`)).json();
      if (!d.extract) throw new Error('none');
      if ($('q').value.trim() !== q) return;
      box.innerHTML = `<article class="rise bg-white dark:bg-[#14221b] border border-black/10 dark:border-white/10 rounded-2xl p-5 flex gap-4 items-start">
          ${d.thumbnail ? `<img src="${d.thumbnail.source}" alt="" class="w-24 h-24 object-cover rounded-xl shrink-0">` : ''}
          <div class="min-w-0">
            <p class="text-xs text-slate-500 dark:text-slate-400 mb-1"><i class="fa-brands fa-wikipedia-w mx-1"></i>${t().wiki}</p>
            <h2 class="font-bold text-xl mb-1"></h2>
            <p class="text-sm leading-7 text-slate-700 dark:text-slate-300 desc"></p>
            <a target="_blank" rel="noopener noreferrer" class="inline-block mt-2 text-sm font-semibold text-brand-700 dark:text-brand-500 hover:underline">${t().readMore}</a>
          </div></article>`;
      box.querySelector('h2').textContent = d.title;
      box.querySelector('.desc').textContent = d.extract;
      box.querySelector('a').href = (d.content_urls && d.content_urls.desktop && d.content_urls.desktop.page) || '#';
    } catch (e) {
      if ($('q').value.trim() !== q) return;
      box.innerHTML = `<p class="rise text-center text-sm text-slate-500 dark:text-slate-400">${t().noAnswer}</p>`;
    }
  }

  /* ---------- Input behaviour ---------- */
  let ansTimer = null;
  $('q').addEventListener('input', () => {
    const q = $('q').value.trim();
    syncAiLink();
    $('clearBtn').classList.toggle('hidden', !q);
    $('micBtn').classList.toggle('hidden', !!q || !SR);
    clearTimeout(sugTimer); clearTimeout(ansTimer);
    if (!q) { closeSug(); showAnswer(''); return; }
    sugTimer = setTimeout(() => fetchSug(q), 160);
    ansTimer = setTimeout(() => showAnswer(q), 650);
  });
  $('q').addEventListener('keydown', e => {
    if (!sugItems.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); sugIndex = (sugIndex + 1) % sugItems.length; renderSug(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sugIndex = (sugIndex - 1 + sugItems.length) % sugItems.length; renderSug(); }
    else if (e.key === 'Escape') closeSug();
  });
  $('q').addEventListener('blur', () => setTimeout(closeSug, 120));
  $('clearBtn').onclick = () => { $('q').value = ''; $('q').dispatchEvent(new Event('input')); $('q').focus(); };

  /* ---------- Voice search ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    $('micBtn').classList.remove('hidden');
    $('micBtn').onclick = () => {
      const r = new SR();
      r.lang = lang === 'ar' ? 'ar-DZ' : 'en-US';
      r.interimResults = false;
      $('micBtn').classList.add('animate-pulse');
      r.onresult = e => { $('q').value = e.results[0][0].transcript; $('q').dispatchEvent(new Event('input')); search(); };
      r.onend = r.onerror = () => $('micBtn').classList.remove('animate-pulse');
      try { r.start(); } catch (e) {}
    };
  }

  /* ---------- Start ---------- */
  applyLang();
  const initial = new URLSearchParams(location.search).get('q');
  if (initial) { $('q').value = initial; $('q').dispatchEvent(new Event('input')); }
})();
</script>
<script>document.addEventListener('dragstart',function(e){if(e.target&&e.target.tagName==='IMG')e.preventDefault();});</script>
